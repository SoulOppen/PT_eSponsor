<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" role="img" aria-labelledby="tbp dbp">
  <title id="tbp">Borrador, publicaciùn y pùgina pùblica</title>
  <desc id="dbp">El editor y la API persisten bloques en BD; al publicar se guarda snapshot; la URL pùblica muestra solo la versiùn publicada.</desc>
  <rect width="760" height="260" fill="#f8fafc"/>
  <text x="380" y="28" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="600" fill="#0f172a">Borrador ù publicar ù /@{slug}</text>
  <rect x="24" y="52" width="200" height="100" rx="8" fill="#fff" stroke="#64748b" stroke-width="1.5"/>
  <text x="124" y="82" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#0f172a">Editor + API</text>
  <text x="124" y="104" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#334155">/dashboard ù /api/*</text>
  <text x="124" y="124" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#334155">CRUD / reorder / duplicate</text>
  <text x="124" y="144" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="9" fill="#64748b">Sesiùn web + CSRF</text>
  <path d="M 226 102 L 254 102" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#mbp)"/>
  <rect x="256" y="52" width="200" height="100" rx="8" fill="#fff" stroke="#64748b" stroke-width="1.5"/>
  <text x="356" y="82" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#0f172a">Base de datos</text>
  <text x="356" y="104" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#334155">blocks ù props JSON</text>
  <text x="356" y="124" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#334155">is_published ù orden</text>
  <text x="356" y="144" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="9" fill="#64748b">Site ∑ published_blocks_snapshot</text>
  <path d="M 458 102 L 486 102" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#mbp)"/>
  <rect x="488" y="52" width="248" height="100" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.5"/>
  <text x="612" y="82" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#0f172a">POST publicar</text>
  <text x="612" y="104" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#334155">/api/site/publish</text>
  <text x="612" y="124" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#334155">published_blocks_snapshot</text>
  <text x="612" y="144" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="9" fill="#0f766e">Invalidaciùn cachù ù public_site:{slug}</text>
  <rect x="220" y="180" width="320" height="56" rx="8" fill="#fff" stroke="#0f766e" stroke-width="2"/>
  <text x="380" y="208" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#0f172a">GET /@{slug}</text>
  <text x="380" y="226" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#334155">Solo bloques publicados ù Blade ù SEO</text>
  <path d="M 612 154 L 612 174 L 380 174 L 380 176" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#mbp)"/>
  <text x="380" y="252" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#64748b">Vista previa borrador: /draft/@{slug} (detalle en README). Esquema conceptual.</text>
  <defs>
    <marker id="mbp" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
