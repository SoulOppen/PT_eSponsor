<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-labelledby="tci dci">
  <title id="tci">Pipeline CI en GitHub Actions</title>
  <desc id="dci">Pasos descritos en .github/workflows/ci.yml para la rama develop: PHP 8.4, Node 20, composer, npm ci, vite build, pest, vitest.</desc>
  <rect width="800" height="300" fill="#f8fafc"/>
  <text x="400" y="26" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="600" fill="#0f172a">CI (develop)  GitHub Actions</text>
  <text x="400" y="46" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#64748b">ubuntu-latest ù segùn .github/workflows/ci.yml</text>
  <!-- Row 1 -->
  <rect x="16" y="64" width="92" height="44" rx="6" fill="#fff" stroke="#64748b" stroke-width="1.5"/>
  <text x="62" y="92" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#0f172a">checkout</text>
  <path d="M 110 86 L 128 86" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#mci)"/>
  <rect x="130" y="64" width="100" height="44" rx="6" fill="#fff" stroke="#64748b" stroke-width="1.5"/>
  <text x="180" y="88" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#0f172a">PHP 8.4</text>
  <text x="180" y="100" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="8" fill="#64748b">setup-php</text>
  <path d="M 232 86 L 250 86" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#mci)"/>
  <rect x="252" y="64" width="100" height="44" rx="6" fill="#fff" stroke="#64748b" stroke-width="1.5"/>
  <text x="302" y="88" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#0f172a">Node 20</text>
  <text x="302" y="100" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="8" fill="#64748b">npm cache</text>
  <path d="M 354 86 L 372 86" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#mci)"/>
  <rect x="374" y="64" width="110" height="44" rx="6" fill="#fff" stroke="#64748b" stroke-width="1.5"/>
  <text x="429" y="92" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#0f172a">composer install</text>
  <path d="M 486 86 L 504 86" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#mci)"/>
  <rect x="506" y="64" width="84" height="44" rx="6" fill="#fff" stroke="#64748b" stroke-width="1.5"/>
  <text x="548" y="92" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#0f172a">npm ci</text>
  <path d="M 592 86 L 610 86" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#mci)"/>
  <rect x="612" y="64" width="86" height="44" rx="6" fill="#fff" stroke="#64748b" stroke-width="1.5"/>
  <text x="655" y="88" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#0f172a">.env +</text>
  <text x="655" y="100" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#0f172a">app key</text>
  <path d="M 700 86 L 718 86" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#mci)"/>
  <rect x="720" y="64" width="64" height="44" rx="6" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.5"/>
  <text x="752" y="92" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" font-weight="600" fill="#0f172a">vite build</text>
  <!-- Row 2 -->
  <rect x="280" y="140" width="120" height="48" rx="6" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.5"/>
  <text x="340" y="170" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11" font-weight="600" fill="#0f172a">php artisan test</text>
  <text x="340" y="182" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="8" fill="#64748b">Pest / PHPUnit</text>
  <path d="M 400 164 L 418 164" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#mci)"/>
  <rect x="420" y="140" width="120" height="48" rx="6" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.5"/>
  <text x="480" y="170" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11" font-weight="600" fill="#0f172a">npm run test:run</text>
  <text x="480" y="182" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="8" fill="#64748b">Vitest</text>
  <path d="M 752 108 L 752 120 L 340 120 L 340 138" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#mci2)" stroke-dasharray="4 3"/>
  <text x="520" y="128" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="9" fill="#64748b">tras manifest / build</text>
  <text x="400" y="238" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#64748b">Push a develop y PR hacia develop. Diagrama orientativo.</text>
  <defs>
    <marker id="mci" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#94a3b8"/>
    </marker>
    <marker id="mci2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
