<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 280" role="img" aria-labelledby="title desc">
  <title id="title">Rutas: editor Inertia vs página pública Blade</title>
  <desc id="desc">Esquema textual: dashboard y borrador usan Inertia o Blade según README; la URL pública /@slug solo usa Blade.</desc>
  <rect width="780" height="280" fill="#f8fafc"/>
  <text x="390" y="28" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="600" fill="#0f172a">Rutas y stack de render (resumen del proyecto)</text>
  <rect x="24" y="52" width="220" height="200" rx="8" fill="#fff" stroke="#64748b" stroke-width="1.5"/>
  <text x="134" y="78" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="600" fill="#0f172a">Editor (Inertia · Vue)</text>
  <text x="134" y="102" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#334155">/dashboard</text>
  <text x="134" y="120" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#334155">/dashboard/settings</text>
  <text x="134" y="146" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#334155">Breeze: /login, /register, &</text>
  <rect x="280" y="52" width="220" height="200" rx="8" fill="#fff" stroke="#64748b" stroke-width="1.5"/>
  <text x="390" y="78" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="600" fill="#0f172a">Vista previa borrador</text>
  <text x="390" y="102" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#334155">/draft/@{slug}</text>
  <text x="390" y="126" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#64748b">auth + email verificado</text>
  <text x="390" y="150" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#64748b">Blade; toolbar solo dueño</text>
  <rect x="536" y="52" width="220" height="200" rx="8" fill="#fff" stroke="#0f766e" stroke-width="2"/>
  <text x="646" y="78" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="600" fill="#0f172a">Página pública</text>
  <text x="646" y="102" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#334155">GET /@{slug}</text>
  <text x="646" y="126" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#0f766e">Solo Blade · sin bundle Vue</text>
  <text x="646" y="150" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#64748b">Bloques publicados · SEO</text>
  <path d="M 244 140 L 276 140" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#m)"/>
  <path d="M 500 140 L 532 140" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#m)"/>
  <defs>
    <marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <text x="390" y="250" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="10" fill="#64748b">No representa diseño de UI; solo convenciones descritas en README.</text>
</svg>
